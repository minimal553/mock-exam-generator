name: Temporary Alpha Lifecycle Validation

on:
  push:
    branches:
      - tmp-alpha-data-bridge-20260801
    paths:
      - tmp_alpha_family_search.py
      - .github/workflows/tmp-alpha-lifecycle.yml
  pull_request:
    branches:
      - main
    paths:
      - tmp_alpha_family_search.py
      - .github/workflows/tmp-alpha-lifecycle.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-alpha-data-bridge-20260801
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --disable-pip-version-check duckdb pandas numpy requests

      - name: Download dynamic historical database
        run: |
          curl -L --fail --retry 5 --retry-delay 5 \
            https://github.com/terrylica/binance-futures-availability/releases/download/latest/availability.duckdb.gz \
            -o availability.duckdb.gz
          gunzip -f availability.duckdb.gz
          ls -lh availability.duckdb

      - name: Run frozen mechanism-family search
        run: |
          rm -rf tmp-alpha-family-results
          python tmp_alpha_family_search.py --db availability.duckdb --out tmp-alpha-family-results

      - name: Commit compact results to temporary branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-alpha-family-results
          git commit -m 'chore: lifecycle family search results [alpha-result]' || exit 0
          git push origin HEAD:tmp-alpha-data-bridge-20260801
