name: Temporary SQD Aave Validation

on:
  pull_request:
    branches: [main]
    paths:
      - sqd_mq_analysis.py
      - sqd_mq_fast_runner.py
      - sqd_mq_fast_runner_v2.py
      - .github/workflows/tmp-sqd-aave.yml

permissions:
  contents: write

jobs:
  validate-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-alpha-sqd-20260801
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --disable-pip-version-check requests pandas numpy scipy eth-utils 'eth-hash[pycryptodome]'
      - name: Run continuation-safe equivalent BCLX M-to-Q test
        run: python sqd_mq_fast_runner_v2.py --out sqd-mq-v2-results
      - name: Commit compact results to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sqd-mq-v2-results/summary.json
          git add sqd-mq-v2-results/REPORT.md
          git add sqd-mq-v2-results/extraction_summary.json
          git add sqd-mq-v2-results/asset_map.csv
          git add sqd-mq-v2-results/matched_delever90.csv
          git commit -m 'chore: continuation-safe BCLX results [alpha-result]' || exit 0
          git pull --rebase origin tmp-alpha-sqd-20260801
          git push origin HEAD:tmp-alpha-sqd-20260801
